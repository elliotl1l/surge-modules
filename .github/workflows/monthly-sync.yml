name: Monthly Sync & Sanitize Surge Modules

on:
  schedule:
    - cron: '0 0 1 * *'  # Run on the 1st of every month at 00:00 UTC
  workflow_dispatch:      # Allow manual dispatch from GitHub UI anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sanitizer Script
        run: python3 scripts/sync.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/ AutoNavi.sgmodule weibo.sgmodule Douban.sgmodule
          if git diff --cached --quiet; then
            echo "No upstream changes detected. Everything up to date."
          else
            git commit -m "chore(modules): monthly auto-sync & sanitize $(date +'%Y-%m')"
            git push
          fi
